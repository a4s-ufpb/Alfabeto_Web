<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alfabeto</title>
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/style.css">
    <script src="https://kit.fontawesome.com/c141c3c5e6.js" crossorigin="anonymous"></script>
    <link rel="icon" type="image/x-icon" href="img/logotipofinal.png">
</head>
<body>
    <main>
        <section>
            <img class="titulo" src="img/beto_logo.png" alt="ALFABETO KIDS">
            <a href="https://apps4society.dcx.ufpb.br/alfabeto/" title="Apps4Society" target="_blank"><img src="img/logotipofinal.png" class="a4s" alt="apps4society"></a>
        </section>
        <section class="opcoes">
            <div class="jogar">
                <button class="botao" title="JOGAR" onclick="window.location.href='contextos.html'">
                    <i class="fa-solid fa-play"></i>
                    <span>Jogar</span>
                </button>
            </div>
           
            <div class="ranking">
                <button class="botao" title="RANKING" onclick="window.location.href='ranking.html'">
                    <i class="fa-solid fa-trophy"></i>
                    <span>Ranking</span> 
                </button>
            </div>

            <div class="configuracoes">
                <button class="botao" title="CONFIGURAÇÕES" onclick="window.location.href='configuracao.html'">
                    <i class="fa-solid fa-gear"></i>
                    <span>Configurações</span> 
                </button>
            </div>
        </section>
    </main>

</body>
</html>
